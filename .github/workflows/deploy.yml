name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages solo admite un despliegue a la vez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas (obligatorias)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar pruebas
        run: node --test tests/

  desplegar:
    name: Publicar el sitio
    # Solo se publica si el job de pruebas termina bien.
    needs: pruebas
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}

    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita GitHub Pages automáticamente si el repositorio aún no lo tiene.
          enablement: true

      - name: Preparar el sitio
        run: |
          mkdir -p dist
          cp index.html script.js styles.css dist/
          touch dist/.nojekyll
          test -s dist/index.html

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
